<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiszki — LexMentor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .toolbar { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin: 8px 0 26px; }
    .select { background: rgba(255,255,255,0.05); color: var(--ink); border:1px solid var(--line); padding:12px 18px; border-radius:12px; font-family:var(--sans); font-size:14px; font-weight:600; cursor:pointer; }
    .select:focus { outline:none; border-color: rgba(216,180,99,0.5); }
    .flash-stage { display:grid; place-items:center; min-height:340px; perspective:1600px; }
    .flashcard { width:min(620px,92vw); height:300px; cursor:pointer; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.4,.2,.2,1); position:relative; }
    .flashcard.flipped { transform: rotateY(180deg); }
    .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:22px; display:grid; place-items:center; padding:38px; text-align:center; box-shadow:var(--shadow); border:1px solid var(--line); }
    .face .tag { position:absolute; top:18px; left:22px; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--gold-2); }
    .face .hint { position:absolute; bottom:16px; right:22px; font-size:12px; color:var(--muted); }
    .face-front { background:linear-gradient(155deg, var(--navy-2), var(--navy)); }
    .face-front .txt { font-family:var(--serif); font-size:25px; line-height:1.35; font-weight:600; }
    .face-back { background:linear-gradient(155deg, rgba(70,224,160,0.14), rgba(17,26,53,0.9)); transform:rotateY(180deg); border-color:rgba(70,224,160,0.3); }
    .face-back .txt { font-size:18px; line-height:1.5; }
    .face-back .src { margin-top:14px; font-size:13px; color:var(--indigo-2); }
    .flash-controls { display:flex; gap:14px; justify-content:center; align-items:center; margin:32px 0 8px; flex-wrap:wrap; }
    .icon-btn { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,0.05); border:1px solid var(--line); color:var(--ink); cursor:pointer; font-size:20px; transition:.2s; }
    .icon-btn:hover { border-color:rgba(216,180,99,0.5); color:var(--gold-2); transform:scale(1.08); }
    .counter { color:var(--muted); font-size:14px; min-width:80px; text-align:center; }
  </style>
</head>
<body>
  <div class="bg-fx"></div>

  <nav class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html"><span class="mark">§</span><span class="name">Lex<b>Mentor</b></span></a>
      <div class="nav-links">
        <a href="index.html">Start</a>
        <a href="index.html#kategorie">Kategorie</a>
        <a href="fiszki.html" class="active">Fiszki</a>
      </div>
    </div>
  </nav>

  <header class="page-head wrap" style="text-align:center">
    <h1>Fiszki</h1>
    <p class="sub">Powtórka na bazie pytań testowych. Kliknij kartę, aby zobaczyć odpowiedź.</p>
  </header>

  <main class="wrap">
    <div class="toolbar"><select class="select" id="deck-select"></select></div>
    <div class="progress-bar" style="width:min(620px,92vw); margin:0 auto 8px"><span id="flash-progress"></span></div>

    <div class="flash-stage">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="face face-front">
          <span class="tag">Pytanie</span>
          <div class="txt" id="card-front">Ładowanie…</div>
          <span class="hint">kliknij, aby odwrócić</span>
        </div>
        <div class="face face-back">
          <span class="tag">Odpowiedź</span>
          <div>
            <div class="txt" id="card-back"></div>
            <div class="src" id="card-src"></div>
          </div>
          <span class="hint">kliknij, aby odwrócić</span>
        </div>
      </div>
    </div>

    <div class="flash-controls">
      <button class="icon-btn" onclick="prevCard()" title="Poprzednia">←</button>
      <span class="counter" id="card-counter">0 / 0</span>
      <button class="icon-btn" onclick="nextCard()" title="Następna">→</button>
    </div>
  </main>

  <footer class="footer"><div class="wrap">© <span id="year"></span> <b>LexMentor</b> — portal do nauki prawa</div></footer>

  <script src="pytania-spadkowe.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>initFlashcards();</script>
</body>
</html>
